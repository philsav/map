<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>TPASC - Facility Map</title>

    <!-- Mapplic CSS -->
    <link rel="stylesheet" href="mapplic.css">

    <!-- Mapplic JS (must be type="module") -->
    <script type="module" src="mapplic.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        }

        #map-container {
            width: 100%;
            height: 100vh;
        }
        h1{
            padding:1rem;
            margin:0;
            background:#e8e8e8;
        }

    </style>
</head>
<body>

    <h1>Facility Map</h1>

    <!-- Mapplic Map Element -->
    <div id="map-container">
        <mapplic-map data-json="panam-data.json"></mapplic-map>
    </div>

</body>
</html>
